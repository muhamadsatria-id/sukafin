<body class="bg-light-surface-container-lowest text-light-on-surface font-body antialiased">
    <!-- LOGIN -->
  <div id="login-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-[url('bg-login.webp')] bg-cover bg-center bg-no-repeat p-gutter-lg">
    <form id="login-form" class="w-full max-w-sm rounded-xl bg-light-surface-container-lowest p-gutter-xl shadow-[0_16px_48px_-8px_rgba(0,40,32,0.35)]">
      <div class="mb-gutter-md flex items-center gap-1.5" aria-hidden="true">
        <span class="h-2 w-2 rounded-full bg-[#FF5F57]"></span>
        <span class="h-2 w-2 rounded-full bg-[#FEBC2E]"></span>
        <span class="h-2 w-2 rounded-full bg-[#28C840]"></span>
      </div>
      <div class="mb-gutter-md flex items-center gap-gutter-sm">
        <img src="logo.png" alt="Sukafin" class="h-10 w-10 shrink-0 object-contain">
        <div>
          <p class="font-headline text-headline-md leading-tight">SUKAFIN</p>
          <p class="font-label text-label-sm text-light-on-surface-variant">by muhamadsatria</p>
        </div>
      </div>
      <p class="mb-gutter-lg font-body text-body-md text-light-on-surface-variant">Masuk untuk mengelola alokasi dana dan kekayaanmu.</p>
      <label class="mb-gutter-xs block font-label text-label-md" for="login-username">Username</label>
      <input id="login-username" class="mb-gutter-md w-full rounded-lg border border-light-outline-variant bg-light-surface-container-lowest px-gutter-12 py-3 font-body text-body-md outline-none focus:border-light-primary" autocomplete="username" required>
      <div class="mb-gutter-xs flex items-center justify-between gap-gutter-sm">
        <label class="block font-label text-label-md" for="login-password">Password</label>
        <button type="button" data-wa-request="password" class="font-label text-label-sm text-light-primary underline underline-offset-2">Lupa password?</button>
      </div>
      <input id="login-password" type="password" class="mb-gutter-md w-full rounded-lg border border-light-outline-variant bg-light-surface-container-lowest px-gutter-12 py-3 font-body text-body-md outline-none focus:border-light-primary" autocomplete="current-password" required>
      <p id="login-error" class="mb-gutter-sm min-h-4 font-body text-body-sm text-light-error" role="alert"></p>
      <button type="submit" class="w-full rounded-lg bg-light-primary py-3 font-label text-label-lg text-light-on-primary">Masuk</button>
      <p class="mt-gutter-md text-center font-body text-body-sm text-light-on-surface-variant">Hubungi administrator untuk mendapatkan akses.<button type="button" data-wa-request="access" class="font-bold text-light-primary underline underline-offset-2"> Klik di sini</button></p>
    </form>
  </div>
